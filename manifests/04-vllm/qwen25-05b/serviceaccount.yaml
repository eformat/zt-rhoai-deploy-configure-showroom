---
# Identity that inference clients authenticate as when token auth is enabled on the
# InferenceService (security.opendatahub.io/enable-auth: "true"). Mint a bearer token for
# it with `oc create token qwen25-05b-caller -n <project> --duration=1h` and send it as
# `Authorization: Bearer <token>`. The RoleBinding below grants it the one permission the
# kube-rbac-proxy sidecar checks: `get` on this InferenceService.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen25-05b-caller
