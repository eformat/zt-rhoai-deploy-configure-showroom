---
# vLLM simulator runtime — responds to the OpenAI API without loading real weights.
# Ideal for GPU-free smoke tests and the scaling exercises in Module 6.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-simulator-runtime
  labels:
    opendatahub.io/dashboard: "true"
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: false
  multiModel: false
  containers:
    - name: kserve-container
      image: ghcr.io/llm-d/llm-d-inference-sim:latest
      args:
        - "--port=8080"
        - "--model=vllm-simulator"
        - "--served-model-name=vllm-simulator"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "200m"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
