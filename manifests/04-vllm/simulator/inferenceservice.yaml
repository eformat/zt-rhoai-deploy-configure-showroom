---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: vllm-simulator
  annotations:
    openshift.io/display-name: "vLLM simulator (CPU smoke test)"
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-simulator-runtime
      # The simulator generates responses internally; a storageUri is still required
      # by the schema, so we point at a tiny placeholder modelcar.
      storageUri: "oci://quay.io/redhat-ai-services/modelcar-catalog:opt-125m"
