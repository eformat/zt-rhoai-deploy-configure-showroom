---
# oc-mirror v2 ImageSetConfiguration for RHOAI 3.4 (disconnected mirror).
# Adjust the OCP/RHOAI versions and add any extra operators your workshop needs.
apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  platform:
    channels:
      - name: stable-4.21
        type: ocp
        minVersion: 4.21.0
        maxVersion: 4.21.0
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.21
      packages:
        - name: rhods-operator
          # Match the install Subscription (manifests/01-install/operator/subscription.yaml:
          # channel stable-3.4). The catalog's declared default channel is stable-3.x; when you
          # filter channels you must also set defaultChannel to one you keep, or oc-mirror v2 aborts
          # with "the default channel was filtered out, a new default channel must be configured".
          defaultChannel: stable-3.4
          channels:
            - name: stable-3.4
        # Dependencies used by later modules:
        - name: servicemeshoperator
        - name: authorino-operator
        - name: kuadrant-operator
        - name: openshift-cert-manager-operator
        - name: leader-worker-set
  additionalImages:
    - name: quay.io/vllm/vllm-cpu:latest
