---
# CPU-only vLLM ServingRuntime. Templated into the workshop project.
# The RHOAI-shipped "vLLM ServingRuntime for KServe" is GPU-oriented; this variant
# requests CPU only and sets a CPU-friendly dtype so it runs without accelerators.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu-runtime
  annotations:
    openshift.io/display-name: "vLLM CPU ServingRuntime"
    opendatahub.io/recommended-accelerators: '[]'
  labels:
    opendatahub.io/dashboard: "true"
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/vllm/vllm-cpu:latest
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"
        - "--dtype=float32"
        - "--max-model-len=2048"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 12Gi
