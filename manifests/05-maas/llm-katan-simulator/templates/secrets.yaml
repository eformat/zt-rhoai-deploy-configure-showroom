{{- range .Values.providers }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Values.models.namespace }}
  labels:
    # 3.5 uses the IPP (Inference Payload Processor) to inject the key upstream.
    # The legacy 3.4 label (inference.networking.k8s.io/bbr-managed) is applied
    # imperatively in the 3.4 static path only — see 05a-external-models.adoc.
    inference.llm-d.ai/ipp-managed: "true"
    {{- include "llm-katan.labels" $ | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .apiKey | quote }}
{{- end }}
