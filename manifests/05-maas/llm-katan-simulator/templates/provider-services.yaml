{{- range .Values.providers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Values.models.namespace }}
  labels:
    {{- include "llm-katan.labels" $ | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ include "llm-katan.fullname" $ }}.{{ $.Values.models.namespace }}.svc.cluster.local
  ports:
  - port: {{ $.Values.simulator.port }}
    protocol: TCP
{{- end }}
