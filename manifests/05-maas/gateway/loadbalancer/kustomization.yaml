---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LoadBalancer gateway mode. The manifest carries a ${CLUSTER_DOMAIN} placeholder,
# so build with kustomize and render through envsubst before applying:
#   export CLUSTER_DOMAIN=$(oc get ingress.config cluster -o jsonpath='{.spec.domain}')
#   oc kustomize manifests/05-maas/gateway/loadbalancer | envsubst '${CLUSTER_DOMAIN}' | oc apply -f -
resources:
  - gateway.yaml
