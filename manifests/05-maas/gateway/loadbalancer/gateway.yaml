---
# LoadBalancer mode — for clusters with a cloud/MetalLB LoadBalancer provider
# (AWS/ROSA/OSD, or on-prem with MetalLB). The Gateway controller creates a
# Service of type LoadBalancer that receives an external address, and the
# listener terminates client TLS with the cluster wildcard certificate.
#
# On a cluster WITHOUT a LoadBalancer provider this Service stays <pending> and
# the Gateway never reaches Programmed=True — use the clusterip/ mode instead.
#
# Carries a ${CLUSTER_DOMAIN} placeholder, so render it with envsubst:
#   export CLUSTER_DOMAIN=$(oc get ingress.config cluster -o jsonpath='{.spec.domain}')
#   oc kustomize manifests/05-maas/gateway/loadbalancer | envsubst '${CLUSTER_DOMAIN}' | oc apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-default
spec:
  controllerName: "openshift.io/gateway-controller/v1"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # The MaaS controller hardcodes this name/namespace (GATEWAY env) — do not rename.
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    # Lets the ODH/Authorino stack bootstrap gateway TLS wiring automatically.
    security.opendatahub.io/authorino-tls-bootstrap: "true"
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/instance: maas-default-gateway
    app.kubernetes.io/component: gateway
    kuadrant.io/gateway: "true"
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      hostname: "maas.${CLUSTER_DOMAIN}"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # RHDP-provisioned clusters ship a wildcard cert in this secret.
          - group: ""
            kind: Secret
            name: cert-manager-ingress-cert
