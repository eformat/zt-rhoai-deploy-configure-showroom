---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# gateway.yaml is intentionally NOT listed here. It carries a ${CLUSTER_DOMAIN}
# placeholder and must be applied through envsubst — `oc apply -k` would set the
# hostname to the literal "maas.${CLUSTER_DOMAIN}" and the Gateway would never
# reach Programmed=True. Apply it directly:
#   export CLUSTER_DOMAIN=$(oc get ingress.config cluster -o jsonpath='{.spec.domain}')
#   envsubst < manifests/05-maas/gateway/gateway.yaml | oc apply -f -
resources: []
