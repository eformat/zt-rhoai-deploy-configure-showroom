---
# Tells the gateway controller to create the gateway Service as ClusterIP and have
# the service-ca operator provision a TLS cert. The Secret name here MUST match the
# certificateRefs in gateway.yaml.
# The ConfigMap name is <gateway-name>-config (data-science-gateway-class convention).
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-default-gateway-config
  namespace: openshift-ingress
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-gw-service-tls"
    spec:
      type: LoadBalancer
