---
# ClusterIP mode — for clusters WITHOUT a LoadBalancer provider (bare-metal,
# on-prem, disconnected, RHDP workshop clusters). The Gateway's Service is created
# as ClusterIP (via the gw-options ConfigMap) and exposed externally by the
# OpenShift Route in route.yaml (re-encrypt). This is the same pattern the built-in
# `data-science-gateway` uses on these clusters, and the documented MaaS
# INGRESS_MODE=clusterip path.
#
# The listener terminates TLS with the service-ca certificate (maas-gw-service-tls),
# which is the *internal* re-encrypt leg; client-facing TLS is terminated by the
# OpenShift Router using the cluster wildcard cert.
# The listener hostname is set so the maas-api can discover the external gateway URL
# from spec.listeners[].hostname — without it the maas-api returns 500 "Unable to
# determine external hostname from Gateway status" on ClusterIP clusters.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-default
spec:
  controllerName: "openshift.io/gateway-controller/v1"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # The MaaS controller hardcodes this name/namespace (GATEWAY env) — do not rename.
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    # Lets the ODH/Authorino stack bootstrap gateway TLS wiring automatically.
    security.opendatahub.io/authorino-tls-bootstrap: "true"
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/instance: maas-default-gateway
    app.kubernetes.io/component: gateway
    kuadrant.io/gateway: "true"
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gw-options
  listeners:
    - name: https
      hostname: "maas.${CLUSTER_DOMAIN}"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # service-ca-operator populates this Secret automatically (see the
          # gw-options ConfigMap). Must match the name there.
          - group: ""
            kind: Secret
            name: maas-gw-service-tls
