---
# MaaS governs models served as an LLMInferenceService (the gateway-native KServe
# serving object), NOT the plain InferenceService from Module 4 — MaaSModelRef.spec.modelRef.kind
# only accepts LLMInferenceService or ExternalModel. This deploys opt-125m a second time as an
# LLMInferenceService wired to the MaaS gateway via spec.router.gateway.refs, so the subscription,
# API key, and rate limit in the following exercise have a model to publish.
#
# The OpenAI model id is spec.model.name ("opt-125m"), kept stable so the Module 5/7 curl and
# playground calls resolve. Weights come from Hugging Face (hf://) — the reference-validated CPU
# path; for a disconnected cluster swap the uri for the OCI modelcar
# (oci://quay.io/redhat-ai-services/modelcar-catalog:opt-125m).
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: opt-125m-maas
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model:
    uri: hf://facebook/opt-125m
    name: opt-125m
  replicas: 1
  router:
    route: {}
    # Attach to the MaaS-enabled gateway created in Exercise 2.
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        # Red Hat supported CPU vLLM image (same build the pre-installed vllm-cpu-x86 runtime uses).
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:0ec0f5ff9a5ff263f58db0cfb19e3d7eef24b94c2d8629fe5145f5a8747e28c9
        env:
          - name: VLLM_LOGGING_LEVEL
            value: INFO
        resources:
          requests:
            cpu: "1"
            memory: 8Gi
          limits:
            cpu: "2"
            memory: 10Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
