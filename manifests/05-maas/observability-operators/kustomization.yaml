---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Observability backend operators for the RHOAI "Observe & monitor" (Perses) dashboard:
# Cluster Observability Operator + Red Hat build of OpenTelemetry. Once their CSVs
# Succeed and DSCI monitoring is Managed, the RHOAI operator brings up the MonitoringStack
# and Perses so the observabilityDashboard tab renders instead of "Service Unavailable".
resources:
  - cluster-observability-operator-subscription.yaml
  - opentelemetry-operator-subscription.yaml
