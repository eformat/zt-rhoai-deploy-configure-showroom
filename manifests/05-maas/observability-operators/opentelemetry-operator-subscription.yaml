---
# Red Hat build of OpenTelemetry (package: opentelemetry-product). Required alongside
# COO for the RHOAI observability dashboard backend and the MaaS telemetry pipeline.
#
# Like COO, this operator only supports AllNamespaces install mode, so the OperatorGroup
# is left with an empty spec (global). Do NOT add targetNamespaces here.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-opentelemetry-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-opentelemetry-operator
  namespace: openshift-opentelemetry-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: openshift-opentelemetry-operator
spec:
  channel: stable
  installPlanApproval: Automatic
  name: opentelemetry-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
