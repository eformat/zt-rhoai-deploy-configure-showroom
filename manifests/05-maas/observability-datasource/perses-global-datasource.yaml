---
# RHOAI 3.5: The Usage dashboard tab is rendered by a PersesDashboard deployed in the
# redhat-ods-applications namespace. Perses resolves datasources per project (namespace),
# so a namespace-scoped PersesDatasource in redhat-ods-monitoring is invisible to it.
#
# A PersesGlobalDatasource is cluster-scoped and visible to all Perses projects. Without
# this, the Usage tab panels show "No datasource found for kind 'PrometheusDatasource'
# and name 'data-science-prometheus-datasource'".
#
# This replaces the 3.4 cluster-prometheus-datasource.yaml workaround. In 3.5 the RHOAI
# Monitoring controller correctly creates a PersesDatasource in redhat-ods-monitoring for
# the LLM dashboards, but the Usage tab needs the global variant.
apiVersion: perses.dev/v1alpha2
kind: PersesGlobalDatasource
metadata:
  name: data-science-prometheus-datasource
  labels:
    platform.opendatahub.io/part-of: monitoring
spec:
  config:
    default: false
    display:
      name: Data Science Prometheus
      description: Data Science MonitoringStack Thanos Querier - provides DS workload metrics
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://thanos-querier-data-science-thanos-querier.redhat-ods-monitoring.svc.cluster.local:10902
