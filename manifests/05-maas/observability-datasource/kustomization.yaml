---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Recreates the default Perses "Cluster Prometheus" datasource (+ its ServiceAccount,
# RBAC, and token secret) that the RHOAI 3.4.3 Monitoring controller fails to create on
# COO 1.5.1 (its generated PersesDatasource omits the now-required caCert.namespace).
# Without a default PrometheusDatasource, every "Observe & monitor" panel errors with
# "No datasource found for kind 'PrometheusDatasource' and name 'undefined'".
resources:
  - cluster-prometheus-datasource.yaml
