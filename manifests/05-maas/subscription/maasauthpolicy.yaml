---
# Binds API-key auth (Authorino, via Connectivity Link) to the published model.
# Schema (maas.opendatahub.io/v1alpha1): modelRefs[] reference the MaaSModelRef by {name, namespace}
# (namespace pinned to the workshop project, same as the subscription); subjects.groups grants
# access to all authenticated users.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: qwen25-05b-auth
spec:
  subjects:
    groups:
      - name: system:authenticated
  modelRefs:
    - name: qwen25-05b
      namespace: rhoai-deploy
