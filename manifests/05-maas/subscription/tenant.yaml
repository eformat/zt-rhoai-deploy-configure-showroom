---
# Reference/fallback ONLY — not applied by kustomization.yaml.
#
# The maas-controller bootstraps the singleton Tenant automatically once modelsAsService is Managed
# and Red Hat Connectivity Link is installed (the controller crash-loops until the Kuadrant
# TokenRateLimitPolicy CRD exists, so the tenant does not appear until Exercise 2 completes).
# The name must be `default-tenant` (CEL-enforced singleton). Apply this manually only if no
# default-tenant appears after the controller reaches Ready:
#   oc get tenant default-tenant -n models-as-a-service
#   oc apply -f manifests/05-maas/subscription/tenant.yaml   # only if the above is empty
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: models-as-a-service
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
