---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-jobset-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-jobset-operator
  namespace: openshift-jobset-operator
spec:
  # This operator only supports OwnNamespace/SingleNamespace install modes; an empty
  # OperatorGroup defaults to AllNamespaces and the CSV fails with
  # "AllNamespaces InstallModeType not supported". Target its own namespace.
  targetNamespaces:
    - openshift-jobset-operator
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: job-set
  namespace: openshift-jobset-operator
spec:
  # The only published channel is stable-v1.0 (verify with:
  #   oc get packagemanifest job-set -n openshift-marketplace \
  #     -o jsonpath='{.status.channels[*].name}')
  channel: stable-v1.0
  installPlanApproval: Automatic
  name: job-set
  source: redhat-operators
  sourceNamespace: openshift-marketplace
