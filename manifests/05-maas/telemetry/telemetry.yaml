---
# Istio Telemetry: adds a `subscription` tag (from the x-maas-subscription request header)
# to the gateway's REQUEST_DURATION metric, so latency can be broken down per MaaS
# subscription. Lives in openshift-ingress alongside the MaaS gateway it selects.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: latency-per-subscription
  namespace: openshift-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_DURATION
            mode: CLIENT_AND_SERVER
          tagOverrides:
            subscription:
              operation: UPSERT
              value: request.headers["x-maas-subscription"]
