---
# Distributed inference with llm-d. Deploying an LLMInferenceService brings up the
# llm-d Endpoint Picker (EPP) and vLLM worker pods. CPU-only variant (Red Hat vLLM CPU
# image) so scaling is observable without GPUs.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen25-05b-llmd
  namespace: rhoai-deploy
  labels:
    app.kubernetes.io/part-of: llm-d
  annotations:
    # Expose vLLM metrics so user-workload monitoring scrapes them — this is what the
    # KEDA ScaledObject (manifests/06-llmd/autoscaling-keda) queries to scale on queue depth.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  model:
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
    name: qwen25-05b
  replicas: 1
  router:
    scheduler: {}
  template:
    containers:
      - name: main
        # Red Hat supported CPU vLLM image (same build the pre-installed vllm-cpu-x86 runtime uses).
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:0ec0f5ff9a5ff263f58db0cfb19e3d7eef24b94c2d8629fe5145f5a8747e28c9
        # Bound vLLM's CPU memory footprint so 0.5B fits the 12Gi limit below. Without
        # --max-model-len, vLLM profiles against the model's full 32K context, allocates a huge
        # KV cache, and gets OOMKilled on a CPU node (exit 137) — crash-looping the worker.
        args:
          - "--dtype=bfloat16"       # half the weight footprint vs float32
          - "--max-model-len=8192"   # cap context (default would be 32768)
          - "--max-num-seqs=8"       # cap concurrent sequences (default 256); also makes requests
                                     # queue sooner so the KEDA num_requests_waiting trigger fires
          - "--enable-force-include-usage"  # always emit token-usage in responses (MaaS telemetry)
          - "--enforce-eager"        # skip graph capture / extra buffers
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "2"               # GiB reserved for the CPU KV cache
          # Cap the OpenMP thread pool to the cgroup CPU limit. The container sees ALL host cores
          # (e.g. 32) but the cgroup only grants `limits.cpu`; without this, vLLM/OpenMP spawns one
          # thread per host core, thrashes over the few it actually has, and gets CPU-throttled.
          # Keep this == limits.cpu below. NOT pinned to fixed cores (no VLLM_CPU_OMP_THREADS_BIND)
          # because KEDA scales this to multiple replicas that share the node — pinning them all to
          # the same cores would make replicas contend instead of spreading across the node.
          - name: OMP_NUM_THREADS
            value: "2"
        # Sized so all maxReplicaCount (4) replicas fit on a single-node cluster. The scheduler
        # places pods by REQUESTS, not usage: on a single node the control plane already commits
        # ~95% of CPU *requests* while real CPU *usage* sits ~30%, so a cpu request of 2 makes even
        # the 2nd replica unschedulable. We therefore request only 250m (4 replicas = 1 CPU of the
        # request budget) but keep a 2-CPU limit so each pod bursts into the idle real cores. Memory
        # is bounded by --max-model-len + VLLM_CPU_KVCACHE_SPACE above, so 6Gi is ample for 0.5B.
        resources:
          requests:
            cpu: "250m"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
