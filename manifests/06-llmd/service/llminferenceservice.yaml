---
# Distributed inference with llm-d. Deploying an LLMInferenceService brings up the
# llm-d Endpoint Picker (EPP) and vLLM worker pods. CPU-only variant (Red Hat vLLM CPU
# image) so scaling is observable without GPUs.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen25-05b-llmd
  namespace: rhoai-deploy
  labels:
    app.kubernetes.io/part-of: llm-d
  annotations:
    # Expose vLLM metrics so user-workload monitoring scrapes them — this is what the
    # KEDA ScaledObject (manifests/06-llmd/autoscaling-keda) queries to scale on queue depth.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  model:
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
    name: qwen25-05b
  replicas: 1
  # Route through the MaaS gateway created in Module 5 instead of standing up a dedicated
  # inference gateway (openshift-ai-inference). scheduler:{} brings up the llm-d Endpoint Picker
  # and an InferencePool; route:{} creates the HTTPRoute; gateway.refs attaches it to the already
  # running maas-default-gateway. This reuses one envoy proxy (saves CPU) and puts llm-d traffic
  # under MaaS governance, so the Limitador per-subscription token metrics (Module 5, Exercise 8)
  # cover this model too. The gateway default-denies, so the model needs a MaaSModelRef +
  # MaaSSubscription (see ../maas-subscription) or requests are rate-limited before they can queue.
  router:
    scheduler: {}
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        # Red Hat supported CPU vLLM image (same build the pre-installed vllm-cpu-x86 runtime uses).
        image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:0ec0f5ff9a5ff263f58db0cfb19e3d7eef24b94c2d8629fe5145f5a8747e28c9
        # Bound vLLM's CPU memory footprint so 0.5B fits the 8Gi limit below. Without
        # --max-model-len, vLLM profiles against the model's full 32K context, allocates a huge
        # KV cache, and gets OOMKilled on a CPU node (exit 137) — crash-looping the worker.
        args:
          - "--dtype=bfloat16"       # half the weight footprint vs float32
          - "--max-model-len=8192"   # cap context (default would be 32768)
          - "--max-num-seqs=8"       # cap concurrent sequences (default 256); also makes requests
                                     # queue sooner so the KEDA num_requests_waiting trigger fires
          - "--enable-force-include-usage"  # always emit token-usage in responses (MaaS telemetry)
          - "--enforce-eager"        # skip graph capture / extra buffers
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "2"               # GiB reserved for the CPU KV cache
          # The container sees ALL host cores (e.g. 32) but the cgroup CFS quota is `limits.cpu`.
          # Without these, vLLM/OpenMP spawns one thread per host core, thrashes over the cores it
          # actually has, and gets CPU-throttled to ~0.1 tok/s (a short reply then takes minutes and
          # trips the gateway route timeout -> 504). Pin the thread pool to a small, single-NUMA-node
          # core set (0-3): an explicit bind co-locates compute and memory on one NUMA node, which is
          # what makes decode fast here (~2s completions) — do NOT use "auto", which spans both
          # sockets and forces slow cross-NUMA memory access. Keep OMP_NUM_THREADS == limits.cpu.
          # Matches the Module 4 InferenceService. (When KEDA scales to multiple replicas they all
          # pin to cores 0-3 and share them, so size the node with that contention in mind.)
          - name: OMP_NUM_THREADS
            value: "4"
          - name: VLLM_CPU_OMP_THREADS_BIND
            value: "0-3"
        # request stays low so replicas still schedule on a busy single-node cluster; the limit is 4
        # so the CFS quota matches OMP_NUM_THREADS above (throughput is governed by the limit, not the
        # request). Memory is bounded by --max-model-len + VLLM_CPU_KVCACHE_SPACE, so 8Gi suits 0.5B.
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 8Gi
