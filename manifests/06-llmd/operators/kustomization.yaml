---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Autoscaling prerequisite for llm-d (subscription only — safe to apply on its own).
#
# The serving-path operators (LeaderWorkerSet + JobSet) the LLMInferenceService needs are
# installed earlier, in Module 5 (manifests/05-maas/serving-operators). If you skipped
# Module 5, apply that directory — and its operator-config.yaml activation CRs — first.
#
# kedacontroller.yaml is deliberately excluded: its CRD does not exist until the
# custom-metrics-autoscaler CSV reaches Succeeded, so it is applied separately afterwards.
resources:
  - custom-metrics-autoscaler-subscription.yaml
