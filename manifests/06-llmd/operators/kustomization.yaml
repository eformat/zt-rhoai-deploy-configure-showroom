---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# llm-d + autoscaling prerequisites (subscriptions only — safe to apply together).
# Red Hat Connectivity Link is installed in Module 5; if you skipped Module 5, apply
# manifests/05-maas/connectivity-link first.
#
# kedacontroller.yaml is deliberately excluded: its CRD does not exist until the
# custom-metrics-autoscaler CSV reaches Succeeded, so it is applied separately afterwards.
resources:
  - leader-worker-set-subscription.yaml
  - custom-metrics-autoscaler-subscription.yaml
