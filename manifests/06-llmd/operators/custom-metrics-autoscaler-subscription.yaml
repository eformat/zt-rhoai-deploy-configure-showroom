---
# Red Hat Custom Metrics Autoscaler (KEDA). This is the CPU-only autoscaling engine for
# this workshop: it scales the llm-d deployment from a Prometheus query (queue depth)
# with no GPU or Workload Variant Autoscaler required. The KedaController CR that turns
# the operator on lives in kedacontroller.yaml and is applied AFTER this CSV reports
# Succeeded (the KedaController CRD does not exist until then).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-keda
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-keda
  namespace: openshift-keda
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-custom-metrics-autoscaler-operator
  namespace: openshift-keda
spec:
  channel: stable
  installPlanApproval: Automatic
  name: openshift-custom-metrics-autoscaler-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
