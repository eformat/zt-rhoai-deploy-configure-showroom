---
# Binds API-key auth (Authorino, via Connectivity Link) to the Module 6 llm-d model, mirroring the
# Module 5 authpolicy. Schema (maas.opendatahub.io/v1alpha1): modelRefs[] reference the MaaSModelRef
# by {name, namespace} (namespace pinned to the workshop project).
#
# Like the subscription, THIS OBJECT lives in `models-as-a-service` (maas-api's
# MAAS_SUBSCRIPTION_NAMESPACE); subjects.groups is `system:authenticated:oauth` — the group the
# OAuth/OIDC identity presents — which becomes the generated AuthPolicy's `allowed_groups`. Plain
# `system:authenticated` never matches, so every call is denied (403).
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: qwen25-05b-llmd-auth
  namespace: models-as-a-service
spec:
  subjects:
    groups:
      - name: system:authenticated:oauth
  modelRefs:
    - name: qwen25-05b-llmd
      namespace: rhoai-deploy
